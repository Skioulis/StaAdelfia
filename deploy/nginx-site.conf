# nginx site for the menu. Replace menu.example.com with the real domain, then:
#   sudo cp nginx-site.conf /etc/nginx/sites-available/gyros-menu
#   sudo ln -s /etc/nginx/sites-available/gyros-menu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d menu.example.com      # adds HTTPS and the redirect
server {
    listen 80;
    listen [::]:80;
    server_name menu.example.com;

    # Photo uploads in the admin (the app itself accepts up to 5 MB).
    client_max_body_size 6m;

    # Most guests are on phones with mobile data: compress text and the SVG logo.
    gzip on;
    gzip_types image/svg+xml text/css application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
